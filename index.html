<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer PRO</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:auto;
}
.context {
  font-size:14px;
  opacity:0.7;
  margin-bottom:10px;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🎯</h2>

<div class="card">
  <div class="context" id="context"></div>
  <div id="question"></div>

  <input id="answer" placeholder="Translate..." />
  <button onclick="check()">Check</button>

  <div id="feedback"></div>
</div>

<script>

// 30 SCENARI
let scenarios = [
"Aeroporto","Bar","Ristorante","Hotel","Taxi","Lavoro","Telefono","Amico",
"Viaggio","Negozio","Supermercato","Palestra","Casa","Cinema","Strada",
"Ufficio","Colloquio","Riunione","Ospedale","Farmacia","Scuola",
"Università","Treno","Bus","Noleggio auto","Spiaggia","Montagna",
"Centro città","Appuntamento","Weekend"
];

// INTENZIONI REALI
let intents = [

{it:"Vorrei", en:"I would like"},
{it:"Posso avere", en:"Can I have"},
{it:"Ho bisogno di", en:"I need"},
{it:"Cerco", en:"I am looking for"},
{it:"Voglio", en:"I want"},
{it:"Devo", en:"I have to"}

];

// OGGETTI LOGICI
let objects = [
{it:"un caffè", en:"a coffee"},
{it:"un biglietto", en:"a ticket"},
{it:"un taxi", en:"a taxi"},
{it:"il menu", en:"the menu"},
{it:"informazioni", en:"information"},
{it:"aiuto", en:"help"},
{it:"una stanza", en:"a room"},
{it:"acqua", en:"water"}
];

// LUOGHI
let places = [
{it:"per Londra", en:"to London"},
{it:"in centro", en:"to the city center"},
{it:"qui", en:"here"},
{it:"al lavoro", en:"at work"},
{it:"a casa", en:"at home"},
{it:"all’hotel", en:"at the hotel"}
];

// DOMANDE
let questions = [
{it:"Dove si trova", en:"Where is"},
{it:"Quanto costa", en:"How much is"},
{it:"A che ora è", en:"What time is"},
{it:"Posso sapere", en:"Can I know"}
];

// FRASE CORRENTE
let current = {};

// RANDOM
function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

// GENERAZIONE INTELLIGENTE
function generate(){

  let scenario = rand(scenarios);

  let type = Math.random();

  let it = "";
  let en = "";

  // 70% frasi normali
  if(type < 0.7){

    let intent = rand(intents);
    let obj = rand(objects);
    let place = rand(places);

    it = `${intent.it} ${obj.it} ${place.it}`;
    en = `${intent.en} ${obj.en} ${place.en}`;

  } 
  // 30% domande
  else {

    let q = rand(questions);
    let obj = rand(objects);

    it = `${q.it} ${obj.it}`;
    en = `${q.en} ${obj.en}`;

  }

  current = {it, en};

  document.getElementById("context").innerText = "📍 " + scenario;
  document.getElementById("question").innerText = it;

  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// NORMALIZE
function normalize(text){
  return text
    .toLowerCase()
    .replace("i'm","i am")
    .replace("don't","do not")
    .replace(/[.,!?]/g,"")
    .replace(/\b(a|an|the)\b/g,"")
    .replace(/\s+/g," ")
    .trim();
}

// SIMILARITY
function similarity(a,b){
  let A = a.split(" ");
  let B = b.split(" ");
  let match = A.filter(w => B.includes(w)).length;
  return match / Math.max(A.length,B.length);
}

// CHECK
function check(){

  let user = normalize(document.getElementById("answer").value);
  let correct = normalize(current.en);

  let sim = similarity(user, correct);

  let feedback = document.getElementById("feedback");
  let delay = 1500;

  if(user === correct){
    feedback.innerText = "✅ Perfect!";
  }
  else if(sim > 0.7){
    feedback.innerText = "🟡 Almost → " + current.en;
    delay = 4000;
  }
  else{
    feedback.innerText = "❌ " + current.en;
    delay = 8000;
  }

  setTimeout(generate, delay);
}

// START
generate();

</script>

</body>
</html>
