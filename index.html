<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:400px;
  margin:auto;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🧠</h2>

<div class="card">
  <div id="question"></div>
  <input id="answer" placeholder="Write your translation..." />
  <button id="checkBtn" onclick="check()">Check</button>
  <div id="feedback"></div>
</div>

<script>

// VOCABOLI
let subjects = ["i", "you", "we", "they"];
let verbs = [
  {it:"mangio", en:"eat"},
  {it:"bevo", en:"drink"},
  {it:"vedo", en:"see"},
  {it:"compro", en:"buy"},
  {it:"trovo", en:"find"}
];
let objects = ["pane", "caffè", "un film", "un libro"];
let times = ["oggi", "ieri", "domani"];

// stato corrente
let current = {};

// funzione random
function rand(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

// genera frase
function generate(){
  let subject = rand(subjects);
  let verb = rand(verbs);
  let object = rand(objects);
  let time = rand(times);

  // italiano
  let it = subject + " " + verb.it + " " + object + " " + time;

  // inglese base
  let enVerb = verb.en;

  if(time === "ieri"){
    enVerb = verb.en + "ed"; // semplificato
  }

  let en = subject + " " + enVerb + " " + object + " " + time;

  current = {it, en};

  document.getElementById("question").innerText = it;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// controllo risposta
function check(){
  let user = document.getElementById("answer").value.trim().toLowerCase();
  let correct = current.en;

  let feedback = document.getElementById("feedback");
  let btn = document.getElementById("checkBtn");

  if(user === correct){
    feedback.innerText = "✅ Correct!";
  } else {
    feedback.innerText = "❌ Correct: " + correct;
  }

  btn.disabled = true;

  setTimeout(() => {
    btn.disabled = false;
    generate();
  }, 1500);
}

// avvio
generate();

</script>

</body>
</html>
