<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:400px;
  margin:auto;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🧠</h2>

<div class="card">
  <div id="question"></div>
  <input id="answer" placeholder="Write your translation..." />
  <button id="checkBtn" onclick="check()">Check</button>
  <div id="feedback"></div>
</div>

<script>

let phrases = [
  {it:"Ho mangiato ieri", en:["i ate yesterday"]},
  {it:"Vado al lavoro", en:["i go to work","i am going to work"]},
  {it:"Sto studiando inglese", en:["i am studying english"]},
  {it:"Ho visto quel film", en:["i saw that movie"]},
  {it:"Mi piace il caffè", en:["i like coffee"]},
  {it:"Sono stanco oggi", en:["i am tired today"]},
  {it:"Domani lavoro", en:["i work tomorrow","i am working tomorrow"]}
];

let current = -1;

function loadQuestion(){
  let newIndex;

  do {
    newIndex = Math.floor(Math.random() * phrases.length);
  } while (newIndex === current); // evita stessa frase

  current = newIndex;

  document.getElementById("question").innerText = phrases[current].it;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

function check(){
  let user = document.getElementById("answer").value.trim().toLowerCase();
  let correctAnswers = phrases[current].en;

  let feedback = document.getElementById("feedback");
  let btn = document.getElementById("checkBtn");

  if(correctAnswers.includes(user)){
    feedback.innerText = "✅ Correct!";
  } else {
    feedback.innerText = "❌ Correct: " + correctAnswers[0];
  }

  // blocca bottone
  btn.disabled = true;

  // dopo 1.5s cambia frase
  setTimeout(() => {
    btn.disabled = false;
    loadQuestion();
  }, 1500);
}

// prima frase
loadQuestion();

</script>

</body>
</html>
