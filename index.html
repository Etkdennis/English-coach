<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:auto;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
.topbar {
  margin-bottom:10px;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🧠</h2>

<div class="topbar">
❤️ <span id="lives"></span> |
⭐ <span id="score">0</span> |
🔥 <span id="streak">0</span>
</div>

<div class="card">
  <div id="question"></div>

  <input id="answer" placeholder="Write your translation..." />

  <button onclick="check()">Check</button>

  <div id="feedback"></div>
</div>

<script>

// STATS
let lives = parseInt(localStorage.getItem("lives")) || 3;
let score = parseInt(localStorage.getItem("score")) || 0;
let streak = parseInt(localStorage.getItem("streak")) || 0;

// SUBJECTS
let subjects = [
  {it:"Io", en:"I", key:"io"},
  {it:"Tu", en:"You", key:"tu"},
  {it:"Noi", en:"We", key:"noi"},
  {it:"Loro", en:"They", key:"loro"}
];

// VERBS (CORRETTI)
let verbs = [
  {
    it:{io:"vedo", tu:"vedi", noi:"vediamo", loro:"vedono"},
    base:"see", past:"saw"
  },
  {
    it:{io:"mangio", tu:"mangi", noi:"mangiamo", loro:"mangiano"},
    base:"eat", past:"ate"
  },
  {
    it:{io:"bevo", tu:"bevi", noi:"beviamo", loro:"bevono"},
    base:"drink", past:"drank"
  },
  {
    it:{io:"ascolto", tu:"ascolti", noi:"ascoltiamo", loro:"ascoltano"},
    base:"listen", past:"listened"
  }
];

// OBJECTS
let objects = [
  {it:"un libro", en:"a book"},
  {it:"un film", en:"a movie"},
  {it:"un panino", en:"a sandwich"},
  {it:"un caffè", en:"a coffee"},
  {it:"musica", en:"music"},
  {it:"inglese", en:"english"}
];

// PLACES
let places = [
  {it:"a casa", en:"at home"},
  {it:"al lavoro", en:"at work"},
  {it:"al bar", en:"at the bar"},
  {it:"in ufficio", en:"in the office"}
];

// TIMES
let times = [
  {it:"oggi", type:"present", en:"today"},
  {it:"ieri", type:"past", en:"yesterday"},
  {it:"domani", type:"future", en:"tomorrow"}
];

let current = {};

// UI
function updateStats(){
  document.getElementById("lives").innerText = "❤️".repeat(lives);
  document.getElementById("score").innerText = score;
  document.getElementById("streak").innerText = streak;
}

// RANDOM
function rand(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

// GENERATE
function generate(){

  let subject = rand(subjects);
  let verb = rand(verbs);
  let object = rand(objects);
  let place = rand(places);
  let time = rand(times);

  let itVerb = verb.it[subject.key];

  let it = `${subject.it} ${itVerb} ${object.it} ${place.it} ${time.it}`;

  let en = "";

  if(time.type === "present"){
    en = `${subject.en} ${verb.base} ${object.en} ${place.en} ${time.en}`;
  }

  if(time.type === "past"){
    en = `${subject.en} ${verb.past} ${object.en} ${place.en} ${time.en}`;
  }

  if(time.type === "future"){
    en = `${subject.en} will ${verb.base} ${object.en} ${place.en} ${time.en}`;
  }

  current = {it, en};

  document.getElementById("question").innerText = it;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// CHECK
function check(){

  let user = document.getElementById("answer").value.trim().toLowerCase();
  let correct = current.en;

  let feedback = document.getElementById("feedback");
  let delay = 1500;

  if(user === correct){
    feedback.innerText = "✅ Correct!";
    score += 10;
    streak++;
  } else {
    feedback.innerText = "❌ " + correct;
    lives--;
    streak = 0;
    delay = 10000; // 10 sec se sbagli
  }

  localStorage.setItem("lives", lives);
  localStorage.setItem("score", score);
  localStorage.setItem("streak", streak);

  updateStats();

  if(lives <= 0){
    feedback.innerText = "💀 Game Over";
    setTimeout(() => {
      localStorage.clear();
      lives = 3; score = 0; streak = 0;
      updateStats();
      generate();
    }, 2000);
    return;
  }

  setTimeout(generate, delay);
}

// START
updateStats();
generate();

</script>

</body>
</html>
