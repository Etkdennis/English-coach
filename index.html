<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Coach AI</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Coach AI 🧠</h2>

<div class="card">
  <div id="question">Ho mangiato ieri</div>
  <input id="answer" placeholder="Write or speak..." />
  <button onclick="checkTranslation()">Check</button>
  <div id="feedback"></div>
</div>

<script>
async function checkTranslation() {
  const input = document.getElementById("answer").value;

  document.getElementById("feedback").innerText = "Thinking... 🤖";

  const response = await fetch("/check", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text: input })
  });

  const data = await response.json();

  document.getElementById("feedback").innerText = data.result;
}
</script>

</body>
</html>
