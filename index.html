<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English App</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
}
.container {
  max-width:420px;
  margin:auto;
}
.top {
  text-align:center;
  margin-bottom:10px;
}
.stats {
  display:flex;
  justify-content:space-between;
  font-size:14px;
}
.chat {
  background:white;
  color:black;
  border-radius:15px;
  padding:10px;
  height:360px;
  overflow-y:auto;
}
.msg {
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  max-width:80%;
}
.user {
  background:#00c853;
  color:white;
  margin-left:auto;
}
.bot {
  background:#eee;
}
.inputBox {
  display:flex;
  margin-top:10px;
}
input {
  flex:1;
  padding:12px;
}
button {
  padding:12px;
  background:#00c853;
  color:white;
  border:none;
}
select {
  margin-top:5px;
  padding:5px;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
  <h2>English App 🚀</h2>

  <div class="stats">
    <div>🔥 <span id="streak">0</span></div>
    <div>📊 <span id="level">A1</span></div>
    <div>🎯 <span id="goal">0</span>/10</div>
  </div>

  <select id="mode">
    <option value="chat">Chat</option>
    <option value="training">Training</option>
    <option value="past">Past Focus</option>
    <option value="questions">Questions</option>
  </select>
</div>

<div class="chat" id="chat"></div>

<div class="inputBox">
  <input id="input" placeholder="Write..." />
  <button onclick="send()">Send</button>
</div>

</div>

<script>

// STATO
let streak = parseInt(localStorage.getItem("streak")||0);
let goal = parseInt(localStorage.getItem("goal")||0);
let score = parseInt(localStorage.getItem("score")||0);

// UI
const chat = document.getElementById("chat");

function addMsg(text, cls){
  let div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// AGGIORNA UI
function updateUI(){
  document.getElementById("streak").innerText = streak;
  document.getElementById("goal").innerText = goal;

  let lvl = "A1";
  if(score>10) lvl="A2";
  if(score>30) lvl="B1";
  if(score>60) lvl="B2";

  document.getElementById("level").innerText = lvl;

  localStorage.setItem("streak",streak);
  localStorage.setItem("goal",goal);
  localStorage.setItem("score",score);
}

// NORMALIZE
function normalize(t){
  return t.toLowerCase()
    .replace("i'm","i am")
    .replace("don't","do not")
    .replace(/[.,!?]/g,"")
    .trim();
}

// ANALISI
function analyze(text){

  let t = normalize(text);

  if(t.length < 4){
    return {ok:false, msg:"❌ Too short"};
  }

  if(!t.includes(" ")){
    return {ok:false, msg:"🟡 Use full sentence"};
  }

  return {ok:true, msg:"✅ Good!"};
}

// TRAINING PROMPTS
function prompt(mode){

  if(mode==="past"){
    return "👉 Say something in past";
  }

  if(mode==="questions"){
    return "👉 Ask a question";
  }

  return "👉 Say something natural";
}

// SEND
function send(){

  let input = document.getElementById("input");
  let text = input.value.trim();
  if(!text) return;

  addMsg(text,"user");
  input.value="";

  let mode = document.getElementById("mode").value;

  let result = analyze(text);

  if(result.ok){
    score++;
    goal++;
    streak++;
  } else {
    streak = 0;
  }

  updateUI();

  addMsg(result.msg,"bot");

  // FEEDBACK EXTRA
  if(mode==="past" && !text.includes("ed")){
    addMsg("👉 Try past tense (worked, went...)", "bot");
  }

  if(mode==="questions" && !text.includes("?")){
    addMsg("👉 Ask a question (Do you...?)", "bot");
  }

  setTimeout(()=>{
    addMsg(prompt(mode),"bot");
  },800);
}

// START
updateUI();
addMsg("Start speaking 👇","bot");

</script>

</body>
</html>
