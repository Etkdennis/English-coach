<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Coach AI</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg,#141e30,#243b55);
      color:white;
      padding:20px;
      text-align:center;
    }

    .card {
      background:white;
      color:black;
      padding:20px;
      border-radius:15px;
      max-width:400px;
      margin:auto;
    }

    input {
      width:100%;
      padding:12px;
      margin-top:10px;
    }

    button {
      margin-top:10px;
      padding:12px;
      width:100%;
      background:#00c853;
      color:white;
      border:none;
    }
  </style>
</head>

<body>

<h2>English Coach AI 🧠</h2>

<div class="card">
  <div id="question">Ho mangiato ieri</div>
  <input id="answer" placeholder="Write here..." />
  <button onclick="checkTranslation()">Check</button>
  <div id="feedback"></div>
</div>

<script>
async function checkTranslation() {
  const input = document.getElementById("answer").value;

  const response = await fetch("/check", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text: input })
  });

  const data = await response.json();

  document.getElementById("feedback").innerText = data.result;
}
</script>

</body>
</html>
