<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:auto;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
.topbar {
  margin-bottom:10px;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🧠</h2>

<div class="topbar">
❤️ <span id="lives"></span> |
⭐ <span id="score">0</span> |
🔥 <span id="streak">0</span>
</div>

<div class="card">
  <div id="question"></div>

  <input id="answer" placeholder="Write your translation..." />

  <button onclick="check()">Check</button>

  <div id="feedback"></div>
</div>

<script>

// STATS
let lives = parseInt(localStorage.getItem("lives")) || 3;
let score = parseInt(localStorage.getItem("score")) || 0;
let streak = parseInt(localStorage.getItem("streak")) || 0;

// FRASI REALI (puoi aggiungerne quante vuoi)
let sentences = [
  {it:"Io ascolto musica", en:"I listen to music"},
  {it:"Loro ascoltano musica", en:"They listen to music"},
  {it:"Noi guardiamo un film", en:"We watch a movie"},
  {it:"Io bevo caffè", en:"I drink coffee"},
  {it:"Tu mangi un panino", en:"You eat a sandwich"},
  {it:"Io studio inglese", en:"I study english"},
  {it:"Loro lavorano in ufficio", en:"They work in the office"},
  {it:"Io sono a casa", en:"I am at home"},
  {it:"Noi andiamo al bar", en:"We go to the bar"},
  {it:"Io ho mangiato ieri", en:"I ate yesterday"},
  {it:"Loro hanno bevuto caffè", en:"They drank coffee"},
  {it:"Domani lavoro", en:"I will work tomorrow"},
  {it:"Io vado in palestra", en:"I go to the gym"},
  {it:"Lei guarda la TV", en:"She watches TV"},
  {it:"Io leggo un libro", en:"I read a book"},
  {it:"Noi studiamo oggi", en:"We study today"},
  {it:"Io dormo poco", en:"I sleep little"},
  {it:"Loro viaggiano spesso", en:"They travel often"}
];

let current = {};

// UI
function updateStats(){
  document.getElementById("lives").innerText = "❤️".repeat(lives);
  document.getElementById("score").innerText = score;
  document.getElementById("streak").innerText = streak;
}

// GENERATE
function generate(){
  current = sentences[Math.floor(Math.random() * sentences.length)];

  document.getElementById("question").innerText = current.it;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// CHECK
function check(){

  let user = document.getElementById("answer").value.trim().toLowerCase();
  let correct = current.en.toLowerCase();

  let feedback = document.getElementById("feedback");
  let delay = 1500;

  if(user === correct){
    feedback.innerText = "✅ Correct!";
    score += 10;
    streak++;
  } else {
    feedback.innerText = "❌ " + current.en;
    lives--;
    streak = 0;
    delay = 10000;
  }

  localStorage.setItem("lives", lives);
  localStorage.setItem("score", score);
  localStorage.setItem("streak", streak);

  updateStats();

  if(lives <= 0){
    feedback.innerText = "💀 Game Over";
    setTimeout(() => {
      localStorage.clear();
      lives = 3; score = 0; streak = 0;
      updateStats();
      generate();
    }, 2000);
    return;
  }

  setTimeout(generate, delay);
}

// START
updateStats();
generate();

</script>

</body>
</html>
