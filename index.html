<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer PRO</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:auto;
}
.context {
  font-size:14px;
  opacity:0.7;
  margin-bottom:10px;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🎯</h2>

<div class="card">
  <div class="context" id="context"></div>
  <div id="question"></div>

  <input id="answer" placeholder="Translate..." />
  <button onclick="check()">Check</button>

  <div id="feedback"></div>
</div>

<script>

// SCENARI
let scenarios = [
"Aeroporto","Bar","Ristorante","Hotel","Taxi","Lavoro","Telefono","Amico",
"Viaggio","Negozio","Supermercato","Palestra","Casa","Cinema","Strada",
"Ufficio","Colloquio","Riunione","Farmacia","Scuola","Treno","Bus",
"Centro città","Weekend","Appuntamento","Montagna","Spiaggia","Ospedale"
];

// PARTI
let starters = ["Voglio","Vorrei","Ho bisogno di","Cerco"];
let startersEN = ["I want","I would like","I need","I am looking for"];

let objects = [
["un caffè","a coffee"],
["un biglietto","a ticket"],
["un taxi","a taxi"],
["una stanza","a room"],
["acqua","water"],
["il menu","the menu"],
["aiuto","help"]
];

let places = [
["per Londra","to London"],
["in centro","to the city center"],
["qui","here"],
["all’hotel","at the hotel"],
["a casa","at home"]
];

// COSTRUZIONE 300+ FRASI
let exercises = [];

for(let s=0;s<starters.length;s++){
  for(let o=0;o<objects.length;o++){
    for(let p=0;p<places.length;p++){

      let it = `${starters[s]} ${objects[o][0]} ${places[p][0]}`;
      let en = `${startersEN[s]} ${objects[o][1]} ${places[p][1]}`;

      exercises.push({
        context: scenarios[Math.floor(Math.random()*scenarios.length)],
        it,
        en
      });

    }
  }
}

// SHUFFLE (NO RIPETIZIONI)
function shuffle(array){
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

shuffle(exercises);

let index = 0;
let current = {};

// NORMALIZE
function normalize(text){
  return text
    .toLowerCase()
    .replace("i'm","i am")
    .replace("don't","do not")
    .replace(/[.,!?]/g,"")
    .replace(/\b(a|an|the)\b/g,"")
    .replace(/\s+/g," ")
    .trim();
}

// SIMILARITY
function similarity(a,b){
  let A = a.split(" ");
  let B = b.split(" ");
  let match = A.filter(w => B.includes(w)).length;
  return match / Math.max(A.length,B.length);
}

// GENERATE (SENZA RIPETERE)
function generate(){

  if(index >= exercises.length){
    shuffle(exercises);
    index = 0;
  }

  current = exercises[index];
  index++;

  document.getElementById("context").innerText = "📍 " + current.context;
  document.getElementById("question").innerText = current.it;

  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// CHECK INTELLIGENTE
function check(){

  let user = normalize(document.getElementById("answer").value);
  let correct = normalize(current.en);

  let feedback = document.getElementById("feedback");
  let delay = 1500;

  let variations = [
    correct,
    correct.replace("i am looking for","i want"),
    correct.replace("i am looking for","i need"),
    correct.replace("i am looking for","i would like")
  ];

  let ok = variations.some(v => similarity(user, v) > 0.7);

  if(user.includes("find")){
    feedback.innerText = "❌ Usa 'looking for', non 'find'";
    delay = 6000;
  }
  else if(ok){
    feedback.innerText = "✅ Natural!";
  }
  else{
    feedback.innerText = "🟡 Better: " + current.en;
    delay = 5000;
  }

  setTimeout(generate, delay);
}

// START
generate();

</script>

</body>
</html>
