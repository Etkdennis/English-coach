<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI English Coach</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:auto;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
.context {
  margin-bottom:10px;
  font-size:14px;
}
</style>
</head>

<body>

<h2>AI English Coach 🧠</h2>

<div class="card">
  <div class="context" id="context"></div>
  <div id="scenario"></div>

  <input id="answer" placeholder="Say something natural..." />

  <button onclick="check()">Check</button>

  <div id="feedback"></div>
</div>

<script>

// ⚠️ SE VUOI AI VERA → INSERISCI QUI LA KEY
const API_KEY = ""; // <-- metti qui la tua key

// SCENARI REALI
let scenarios = [
  {context:"Bar", text:"Ordina qualcosa", keywords:["coffee","beer","water","want","have"]},
  {context:"Amico", text:"Proponi di uscire", keywords:["go","out","tonight","come"]},
  {context:"Lavoro", text:"Dì che sei occupato", keywords:["busy","working","now"]},
  {context:"Telefono", text:"Dì che richiami dopo", keywords:["call","later"]},
  {context:"Viaggio", text:"Chiedi dove è l’hotel", keywords:["where","hotel"]},
];

let current = {};

function rand(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

// GENERA SCENARIO
function generate(){
  current = rand(scenarios);
  document.getElementById("context").innerText = current.context;
  document.getElementById("scenario").innerText = current.text;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// FALLBACK (senza AI)
function basicCheck(user){
  let score = 0;
  current.keywords.forEach(k=>{
    if(user.includes(k)) score++;
  });

  if(score >= 2) return "✅ Good sentence!";
  if(score === 1) return "🟡 Almost, expand it.";
  return "❌ Try again (more natural English)";
}

// AI CHECK
async function aiCheck(user){

  try {
    let res = await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + API_KEY
      },
      body: JSON.stringify({
        model:"gpt-4.1-mini",
        messages:[
          {
            role:"system",
            content:"You are an English teacher. Correct and improve sentences. Be concise."
          },
          {
            role:"user",
            content:`User said: "${user}". Give correction + short explanation.`
          }
        ]
      })
    });

    let data = await res.json();
    return data.choices[0].message.content;

  } catch {
    return "Errore AI";
  }
}

// CHECK
async function check(){

  let user = document.getElementById("answer").value.toLowerCase();
  let feedback = document.getElementById("feedback");

  // se NON hai API
  if(!API_KEY){
    feedback.innerText = basicCheck(user);
    setTimeout(generate,4000);
    return;
  }

  // se hai API
  feedback.innerText = "Thinking...";

  let result = await aiCheck(user);

  feedback.innerText = result;

  setTimeout(generate,6000);
}

// START
generate();

</script>

</body>
</html>
