<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer PRO</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:auto;
}
.context {
  font-size:14px;
  opacity:0.7;
  margin-bottom:10px;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🎯</h2>

<div class="card">
  <div class="context" id="context"></div>
  <div id="question"></div>

  <input id="answer" placeholder="Translate..." />
  <button onclick="check()">Check</button>

  <div id="feedback"></div>
</div>

<script>

// SCENARI
let scenarios = ["Aeroporto","Bar","Ristorante","Hotel","Taxi","Lavoro","Telefono","Amico","Viaggio","Negozio"];

// INTENTI (logici)
let intents = [
  {it:"Cerco", base:"looking for"},
  {it:"Voglio", base:"want"},
  {it:"Ho bisogno di", base:"need"},
  {it:"Vorrei", base:"would like"}
];

// OGGETTI
let objects = [
  {it:"un biglietto", en:"a ticket"},
  {it:"un caffè", en:"a coffee"},
  {it:"un taxi", en:"a taxi"},
  {it:"una stanza", en:"a room"}
];

// LUOGHI
let places = [
  {it:"per Londra", en:"to London"},
  {it:"in centro", en:"to the city center"},
  {it:"qui", en:"here"}
];

let current = {};

// RANDOM
function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

// GENERATE
function generate(){

  let scenario = rand(scenarios);
  let intent = rand(intents);
  let obj = rand(objects);
  let place = rand(places);

  let it = `${intent.it} ${obj.it} ${place.it}`;

  current = {
    it,
    obj: obj.en,
    place: place.en
  };

  document.getElementById("context").innerText = "📍 " + scenario;
  document.getElementById("question").innerText = it;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// NORMALIZE
function normalize(text){
  return text
    .toLowerCase()
    .replace("i'm","i am")
    .replace("don't","do not")
    .replace(/[.,!?]/g,"")
    .replace(/\b(a|an|the)\b/g,"")
    .replace(/\s+/g," ")
    .trim();
}

// CHECK INTELLIGENTE GLOBALE
function check(){

  let user = normalize(document.getElementById("answer").value);

  let feedback = document.getElementById("feedback");
  let delay = 1500;

  // pattern corretti
  let patterns = [
    `i am looking for ${current.obj} ${current.place}`,
    `i want ${current.obj} ${current.place}`,
    `i need ${current.obj} ${current.place}`,
    `i would like ${current.obj} ${current.place}`
  ];

  let ok = patterns.some(p => similarity(user, p) > 0.7);

  // ERRORI INTELLIGENTI
  if(user.includes("find")){
    feedback.innerText = "❌ 'find' non si usa così → usa 'looking for'";
    delay = 6000;
  }
  else if(!user.includes("i")){
    feedback.innerText = "❌ Serve il soggetto → 'I...'";
    delay = 5000;
  }
  else if(ok){
    feedback.innerText = "✅ Natural English!";
  }
  else{
    feedback.innerText = "🟡 Better: I am looking for " + current.obj + " " + current.place;
    delay = 5000;
  }

  setTimeout(generate, delay);
}

// SIMILARITY
function similarity(a,b){
  let A = a.split(" ");
  let B = b.split(" ");
  let match = A.filter(w => B.includes(w)).length;
  return match / Math.max(A.length,B.length);
}

// START
generate();

</script>

</body>
</html>
