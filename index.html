<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer Lite</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:400px;
  margin:auto;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🎤</h2>

<div class="card">
  <div id="question"></div>

  <input id="answer" placeholder="Write or speak..." />

  <button onclick="check()">Check</button>
  <button onclick="startVoice()">🎤 Speak</button>

  <div id="feedback"></div>
</div>

<script>

// DATI BASE
let phrases = [
  {it:"Ho mangiato ieri", en:"i ate yesterday"},
  {it:"Vado al lavoro", en:"i go to work"},
  {it:"Sto studiando inglese", en:"i am studying english"},
  {it:"Ho visto quel film", en:"i saw that movie"},
  {it:"Mi piace il caffè", en:"i like coffee"}
];

let current = {};

// GENERA FRASE
function generate(){
  current = phrases[Math.floor(Math.random() * phrases.length)];
  document.getElementById("question").innerText = current.it;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// CHECK
function check(){
  let user = document.getElementById("answer").value.trim().toLowerCase();
  let correct = current.en;

  if(user === correct){
    document.getElementById("feedback").innerText = "✅ Correct!";
  } else {
    document.getElementById("feedback").innerText = "❌ Correct: " + correct;
  }

  setTimeout(generate, 1500);
}

// 🎤 VOCE (Speech Recognition)
function startVoice(){

  if (!('webkitSpeechRecognition' in window)) {
    alert("Voice not supported on this device");
    return;
  }

  let recognition = new webkitSpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = function(event) {
    let text = event.results[0][0].transcript;
    document.getElementById("answer").value = text;
  };
}

// start
generate();

</script>

</body>
</html>
