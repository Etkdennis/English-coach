<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Trainer</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#141e30,#243b55);
  color:white;
  padding:20px;
  text-align:center;
}
.card {
  background:white;
  color:black;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:auto;
}
input {
  width:100%;
  padding:12px;
  margin-top:10px;
}
button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#00c853;
  color:white;
  border:none;
}
#feedback {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>English Trainer 🧠</h2>

<div class="card">
  <div id="question"></div>

  <input id="answer" placeholder="Write your translation..." />

  <button onclick="check()">Check</button>

  <div id="feedback"></div>
</div>

<script>

// FRASI REALI
let sentences = [
  {it:"Io ascolto musica", en:"I listen to music"},
  {it:"Loro ascoltano musica", en:"They listen to music"},
  {it:"Noi guardiamo un film", en:"We watch a movie"},
  {it:"Io bevo caffè", en:"I drink coffee"},
  {it:"Tu mangi un panino", en:"You eat a sandwich"},
  {it:"Io studio inglese", en:"I study english"},
  {it:"Loro lavorano in ufficio", en:"They work in the office"},
  {it:"Io sono a casa", en:"I am at home"},
  {it:"Noi andiamo al bar", en:"We go to the bar"},
  {it:"Io ho mangiato ieri", en:"I ate yesterday"},
  {it:"Loro hanno bevuto caffè", en:"They drank coffee"},
  {it:"Domani lavoro", en:"I will work tomorrow"},
  {it:"Io vado in palestra", en:"I go to the gym"},
  {it:"Lei guarda la TV", en:"She watches TV"},
  {it:"Io leggo un libro", en:"I read a book"},
  {it:"Noi studiamo oggi", en:"We study today"},
  {it:"Io dormo poco", en:"I sleep little"},
  {it:"Loro viaggiano spesso", en:"They travel often"}
];

let current = {};

// NORMALIZE (intelligente)
function normalize(text){
  return text
    .toLowerCase()
    .replace("i'm", "i am")
    .replace("you're", "you are")
    .replace("we're", "we are")
    .replace("they're", "they are")
    .replace("it's", "it is")
    .replace("don't", "do not")
    .replace("can't", "cannot")
    .replace(/[.,!?]/g, "")
    .replace(/\b(a|an|the)\b/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// SIMILARITÀ
function similarity(a, b){
  let wordsA = a.split(" ");
  let wordsB = b.split(" ");

  let matches = 0;

  wordsA.forEach(word => {
    if(wordsB.includes(word)) matches++;
  });

  return matches / Math.max(wordsA.length, wordsB.length);
}

// GENERA FRASE
function generate(){
  current = sentences[Math.floor(Math.random() * sentences.length)];

  document.getElementById("question").innerText = current.it;
  document.getElementById("answer").value = "";
  document.getElementById("feedback").innerText = "";
}

// CHECK INTELLIGENTE
function check(){

  let userRaw = document.getElementById("answer").value;
  let correctRaw = current.en;

  let user = normalize(userRaw);
  let correct = normalize(correctRaw);

  let scoreMatch = similarity(user, correct);

  let feedback = document.getElementById("feedback");
  let delay = 1500;

  if(user === correct){
    feedback.innerText = "✅ Perfect!";
  }

  else if(scoreMatch > 0.7){
    feedback.innerText = "🟡 Almost correct → " + correctRaw;
    delay = 5000;
  }

  else{
    feedback.innerText = "❌ " + correctRaw;
    delay = 10000;
  }

  setTimeout(generate, delay);
}

// START
generate();

</script>

</body>
</html>
